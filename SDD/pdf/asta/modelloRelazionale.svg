<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950">
  <defs>
    <style>
      .box { fill:#b7d7ea; stroke:#3c5961; stroke-width:2; }
      .head { fill:#ffffff; stroke:#3c5961; stroke-width:2; }
      .line { stroke:#3c5961; stroke-width:2; fill:none; }
      .title { font-family:Arial, sans-serif; font-size:24px; font-weight:bold; fill:#1c3f4a; text-anchor:middle; }
      .name { font-family:Arial, sans-serif; font-size:18px; font-weight:bold; fill:#111; }
      .attr { font-family:Arial, sans-serif; font-size:15px; fill:#111; }
      .pk { font-family:Arial, sans-serif; font-size:15px; font-weight:bold; fill:#111; }
      .card { font-family:Arial, sans-serif; font-size:17px; font-weight:bold; fill:#1c3f4a; text-anchor:middle; dominant-baseline:middle; }
    </style>
  </defs>

  <text x="750" y="36" class="title">Modello Relazionale - AFAM Connect</text>

  <g id="studente">
    <rect x="70" y="360" width="285" height="245" class="box"/>
    <rect x="70" y="360" width="285" height="32" class="head"/>
    <text x="80" y="382" class="name">STUDENTE</text>
    <text x="80" y="415" class="pk">PK id_studente</text>
    <text x="80" y="438" class="attr">nome</text>
    <text x="80" y="461" class="attr">cognome</text>
    <text x="80" y="484" class="attr">codice_fiscale UNIQUE</text>
    <text x="80" y="507" class="attr">email UNIQUE</text>
    <text x="80" y="530" class="attr">telefono</text>
    <text x="80" y="553" class="attr">percorso_foto</text>
    <text x="80" y="576" class="attr">password</text>
  </g>

  <g id="background">
    <rect x="470" y="80" width="310" height="172" class="box"/>
    <rect x="470" y="80" width="310" height="32" class="head"/>
    <text x="480" y="102" class="name">BACKGROUND_ARTISTICO</text>
    <text x="480" y="135" class="pk">PK id_background</text>
    <text x="480" y="158" class="attr">universita</text>
    <text x="480" y="181" class="attr">collaborazioni, autori</text>
    <text x="480" y="204" class="attr">partecipazioni</text>
    <text x="480" y="227" class="attr">FK id_studente</text>
  </g>

  <g id="categoria">
    <rect x="470" y="300" width="310" height="118" class="box"/>
    <rect x="470" y="300" width="310" height="32" class="head"/>
    <text x="480" y="322" class="name">CATEGORIA_ARTISTICA</text>
    <text x="480" y="355" class="pk">PK id_categoria</text>
    <text x="480" y="378" class="attr">nome_categoria</text>
    <text x="480" y="401" class="attr">FK id_studente</text>
  </g>

  <g id="link">
    <rect x="470" y="500" width="330" height="185" class="box"/>
    <rect x="470" y="500" width="330" height="32" class="head"/>
    <text x="480" y="522" class="name">LINK_CONDIVISIONE</text>
    <text x="480" y="555" class="pk">PK id_link</text>
    <text x="480" y="578" class="attr">token_url UNIQUE</text>
    <text x="480" y="601" class="attr">data_creazione, data_scadenza</text>
    <text x="480" y="624" class="attr">visualizzato, stato_link</text>
    <text x="480" y="647" class="attr">FK id_studente</text>
  </g>

  <g id="codice">
    <rect x="470" y="740" width="310" height="140" class="box"/>
    <rect x="470" y="740" width="310" height="32" class="head"/>
    <text x="480" y="762" class="name">CODICE_SBLOCCO</text>
    <text x="480" y="795" class="pk">PK id_codice</text>
    <text x="480" y="818" class="attr">token_testuale UNIQUE</text>
    <text x="480" y="841" class="attr">stato_codice</text>
    <text x="480" y="864" class="attr">FK id_studente</text>
  </g>

  <g id="file">
    <rect x="920" y="270" width="305" height="205" class="box"/>
    <rect x="920" y="270" width="305" height="32" class="head"/>
    <text x="930" y="292" class="name">CONTENUTO_FILE</text>
    <text x="930" y="325" class="pk">PK id_file</text>
    <text x="930" y="348" class="attr">titolo, descrizione</text>
    <text x="930" y="371" class="attr">formato, dimensione</text>
    <text x="930" y="394" class="attr">stato_privacy</text>
    <text x="930" y="417" class="attr">percorso_fisico</text>
    <text x="930" y="440" class="attr">FK id_categoria</text>
  </g>

  <g id="dett_link">
    <rect x="920" y="540" width="305" height="105" class="box"/>
    <rect x="920" y="540" width="305" height="32" class="head"/>
    <text x="930" y="562" class="name">DETTAGLIO_LINK</text>
    <text x="930" y="595" class="pk">PK/FK id_link</text>
    <text x="930" y="618" class="pk">PK/FK id_file</text>
  </g>

  <g id="dett_codice">
    <rect x="920" y="760" width="305" height="105" class="box"/>
    <rect x="920" y="760" width="305" height="32" class="head"/>
    <text x="930" y="782" class="name">DETTAGLIO_CODICE</text>
    <text x="930" y="815" class="pk">PK/FK id_codice</text>
    <text x="930" y="838" class="pk">PK/FK id_file</text>
  </g>

  <!-- Collegamenti da STUDENTE verso le relazioni figlie -->
  <path d="M355,390 L435,390 L435,166 L470,166" class="line"/>
  <text x="370" y="372" class="card">1</text>
  <text x="450" y="150" class="card">0..*</text>

  <path d="M355,430 L445,430 L445,360 L470,360" class="line"/>
  <text x="370" y="412" class="card">1</text>
  <text x="450" y="344" class="card">0..*</text>

  <path d="M355,485 L435,485 L435,592 L470,592" class="line"/>
  <text x="370" y="468" class="card">1</text>
  <text x="450" y="576" class="card">0..*</text>

  <path d="M355,530 L455,530 L455,810 L470,810" class="line"/>
  <text x="370" y="548" class="card">1</text>
  <text x="450" y="794" class="card">0..*</text>

  <!-- Collegamento CATEGORIA_ARTISTICA - CONTENUTO_FILE -->
  <path d="M780,360 L920,360" class="line"/>
  <text x="800" y="342" class="card">1</text>
  <text x="900" y="342" class="card">0..*</text>

  <!-- Collegamenti delle relazioni associative -->
  <path d="M800,592 L920,592" class="line"/>
  <text x="820" y="574" class="card">1</text>
  <text x="900" y="574" class="card">1..*</text>

  <path d="M1225,592 L1300,592 L1300,372 L1225,372" class="line"/>
  <text x="1245" y="576" class="card">0..*</text>
  <text x="1245" y="356" class="card">1</text>

  <path d="M780,810 L920,810" class="line"/>
  <text x="800" y="792" class="card">1</text>
  <text x="900" y="792" class="card">1..*</text>

  <path d="M1225,810 L1330,810 L1330,410 L1225,410" class="line"/>
  <text x="1245" y="794" class="card">0..*</text>
  <text x="1245" y="428" class="card">1</text>
</svg>
