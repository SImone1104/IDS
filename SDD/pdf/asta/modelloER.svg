  <path d="M1100,225 L1000,225 L1000,285" class="line"/>
  <path d="M1000,375 L1000,455 L860,455 L860,675" class="line"/>
  <text x="1082" y="242" class="card">0..*</text>
  <text x="880" y="655" class="card">1..*</text>

  <!-- Codice - Contenuto -->
  <path d="M1100,615 L1035,615 L1035,665" class="line"/>
  <path d="M955,710 L930,710" class="line"/>
  <text x="1082" y="632" class="card">0..*</text>
